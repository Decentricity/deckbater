name: Competition build and playthrough
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: deckbater-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.13.0
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run size
      - run: npm test
      - name: Generated artifacts are current
        run: git diff --exit-code -- dist/
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4
        id: chrome
        with:
          chrome-version: stable
      - name: Chrome complete playthrough
        run: node test/browser.mjs
        env:
          BROWSER_PATH: ${{ steps.chrome.outputs.chrome-path }}
          TEST_OUTPUT: test/output/chrome
      - uses: browser-actions/setup-firefox@0bc507ddf224827e3b1af68e014d5e42ab93e795
        id: firefox
        with:
          firefox-version: latest
      - name: Firefox complete playthrough
        run: node test/browser.mjs
        env:
          TEST_BROWSER: firefox
          BROWSER_PATH: ${{ steps.firefox.outputs.firefox-path }}
          TEST_OUTPUT: test/output/firefox
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deckbater-build-and-playthrough
          path: |
            dist/
            test/output/
          retention-days: 14
