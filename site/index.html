<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deckbater — Prototype</title>
<style>
  :root{--ink:#171321;--paper:#f6e9b7;--grass:#7ea35a;--dark:#31413a;--accent:#d75b54;--blue:#556fa3}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:#111;color:var(--paper);font-family:monospace}
  body{display:grid;place-items:center;overflow:hidden}
  #wrap{width:min(100vw,960px);padding:12px;text-align:center}
  h1{margin:0 0 6px;font-size:clamp(18px,3vw,28px);letter-spacing:3px;text-transform:uppercase}
  #tag{opacity:.7;margin-bottom:8px;font-size:12px}
  #frame{position:relative;margin:auto;aspect-ratio:16/9;width:100%;max-width:896px;background:#000;border:8px solid #30283a;box-shadow:0 0 0 4px #88735b;image-rendering:pixelated}
  canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
  #hud{position:absolute;inset:0;pointer-events:none;text-align:left}
  #prompt{position:absolute;left:8px;bottom:8px;padding:4px 6px;background:#171321dd;border:2px solid #f6e9b7;font-size:11px;display:none}
  #dialog{position:absolute;inset:auto 6px 6px 6px;background:#171321f3;border:3px solid #f6e9b7;padding:8px;display:none;pointer-events:auto}
  #speaker{font-weight:bold;color:#ffdf69;margin-bottom:4px}
  #line{min-height:28px;font-size:13px;line-height:1.25}
  #cards{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:7px}
  button{font:inherit;font-weight:bold;background:#f6e9b7;color:#171321;border:0;padding:7px 4px;min-height:34px;cursor:pointer;box-shadow:inset -3px -3px #a8946c}
  button:hover,button:focus{outline:2px solid #ffdf69;outline-offset:1px}
  button:active{transform:translate(1px,1px)}
  #concepts{position:absolute;right:7px;top:7px;max-width:48%;font-size:10px;text-align:right}
  .chip{display:inline-block;margin:2px 0 0 3px;padding:2px 4px;background:#30283add;border:1px solid #f6e9b777}
  #help{margin-top:8px;font-size:11px;opacity:.7}
  @media(max-width:600px){#cards{grid-template-columns:repeat(2,1fr)} #line{font-size:11px}}
</style>
</head>
<body>
<div id="wrap">
  <h1>DECKBATER</h1>
  <div id="tag">you debate with a deck</div>
  <div id="frame">
    <canvas id="c" width="256" height="144"></canvas>
    <div id="hud">
      <div id="concepts"></div>
      <div id="prompt">[E] TALK</div>
      <div id="dialog">
        <div id="speaker"></div>
        <div id="line"></div>
        <div id="cards"></div>
      </div>
    </div>
  </div>
  <div id="help">WASD / arrows to move · E to talk · 1–4 play a card · ESC closes dialogue</div>
</div>
<script>
const C=document.querySelector('#c'),X=C.getContext('2d');X.imageSmoothingEnabled=false;
const promptEl=document.querySelector('#prompt'),dialog=document.querySelector('#dialog'),speaker=document.querySelector('#speaker'),line=document.querySelector('#line'),cardsEl=document.querySelector('#cards'),conceptEl=document.querySelector('#concepts');
const S={x:34,y:93,dir:0,dialog:false,step:0,concepts:[],trust:0};
const nara={x:142,y:76};
const keys={};
const caveman=['YES','NO','MAYBE','I DUNNO'];
const addConcept=(s)=>{if(!S.concepts.includes(s)){S.concepts.push(s);renderConcepts()}};
function renderConcepts(){conceptEl.innerHTML=S.concepts.map(x=>`<span class="chip">${x}</span>`).join('')}
function tile(x,y,w,h,col){X.fillStyle=col;X.fillRect(x,y,w,h)}
function drawWorld(){
  tile(0,0,256,144,'#6d8d51');
  // road / courtyard
  tile(0,92,256,52,'#b6a57a');
  for(let x=0;x<256;x+=16){tile(x,92,15,3,'#8e7d60')}
  // apartment block
  tile(76,18,116,74,'#d5c78e'); tile(80,22,108,66,'#756c63');
  tile(84,27,26,23,'#56636c'); tile(116,27,26,23,'#56636c'); tile(148,27,26,23,'#56636c');
  tile(91,61,24,27,'#3c302e'); tile(152,61,26,27,'#3c302e');
  // basement door
  tile(202,66,24,26,'#2c262b'); tile(205,69,18,20,'#574c4b');
  tile(211,78,2,2,'#f6e9b7');
  // little trees
  for(const [x,y] of [[20,35],[228,35],[35,61]]){tile(x-3,y,6,13,'#4b3a28');tile(x-10,y-9,20,15,'#3f6b45');tile(x-6,y-15,12,10,'#568651')}
  // Nara
  tile(nara.x-4,nara.y-8,8,8,'#d9b28c'); tile(nara.x-5,nara.y,10,12,'#9f4f61'); tile(nara.x-4,nara.y+12,3,7,'#33283d'); tile(nara.x+1,nara.y+12,3,7,'#33283d');
  // package/envelope hint
  tile(nara.x+7,nara.y+1,7,5,'#d7c48c'); tile(nara.x+8,nara.y+2,5,1,'#8f7656');
  // player
  tile(S.x-4,S.y-8,8,8,'#e0b38b'); tile(S.x-5,S.y,10,11,'#4c6d91'); tile(S.x-4,S.y+11,3,7,'#1f2730'); tile(S.x+1,S.y+11,3,7,'#1f2730');
  // label
  X.fillStyle='#171321';X.font='7px monospace';X.fillText('APT 3B',112,15);X.fillText('BASEMENT',195,62);
}
function near(a,b,d=18){return Math.hypot(a.x-b.x,a.y-b.y)<d}
function update(dt){if(!S.dialog){let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);let l=Math.hypot(dx,dy)||1;S.x=Math.max(7,Math.min(249,S.x+dx/l*55*dt));S.y=Math.max(64,Math.min(135,S.y+dy/l*55*dt))}promptEl.style.display=!S.dialog&&near(S,nara)?'block':'none'}
function showCards(list){cardsEl.innerHTML='';list.forEach((t,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${t}`;b.onclick=()=>choose(i);cardsEl.appendChild(b)})}
function openTalk(){S.dialog=true;dialog.style.display='block';speaker.textContent='NARA';line.textContent='You. Were you downstairs ten minutes ago?';addConcept('DOWNSTAIRS');addConcept('TEN MINUTES AGO');S.step=0;showCards(caveman)}
function closeTalk(){S.dialog=false;dialog.style.display='none'}
function choose(i){
  if(S.step===0){const r=caveman[i];
    if(r==='YES'){line.textContent='Then you must have seen him.';S.trust++;addConcept('HIM')}
    if(r==='NO'){line.textContent='Then somebody else was down there.';addConcept('SOMEBODY ELSE')}
    if(r==='MAYBE'){line.textContent="You don't know whether you were downstairs ten minutes ago?";S.trust--}
    if(r==='I DUNNO'){line.textContent="That's an incredibly concerning answer.";S.trust--}
    S.step=1;setTimeout(()=>{line.textContent='Someone took my package.';addConcept('PACKAGE');showCards(['WHAT IS [PACKAGE]?','YES','NO','I DUNNO'])},450);return;
  }
  if(S.step===1){
    if(i===0){line.textContent="A red courier box. It was outside my door. Now it's gone. Eli probably took it.";['RED','COURIER BOX','MY DOOR','GONE','ELI'].forEach(addConcept);S.step=2;showCards(['WHO IS [ELI]?','YES','NO','MAYBE'])}
    else line.textContent='Nara waits for you to ask something useful.';
    return;
  }
  if(S.step===2){
    if(i===0){line.textContent="The idiot in 2A. He steals deliveries and hides them in the basement until people pay him.";['2A','STEALS','DELIVERIES','BASEMENT','PAY'].forEach(addConcept);S.step=3;showCards(['IS [PACKAGE] IN [BASEMENT]?','YES','NO','I DUNNO'])}
    else line.textContent='Nara squints. "Are we getting anywhere?"';
    return;
  }
  if(S.step===3){
    if(i===0){line.textContent='Probably. But the basement door is locked.';['BASEMENT DOOR','LOCKED','KEY'].forEach(addConcept);S.step=4;showCards(['WHO HAS [KEY]?','YES','NO','MAYBE'])}
    else line.textContent='The locked basement door continues being extremely locked.';
    return;
  }
  if(S.step===4){
    if(i===0){line.textContent='I do. Why?';addConcept('NARA HAS KEY');S.step=5;showCards(['I WANT [KEY].','YES','NO','I DUNNO'])}
    else line.textContent='"...Right," Nara says.';
    return;
  }
  if(S.step===5){
    if(i===0){line.textContent="No. I'm not giving my basement key to someone who might be working with Eli.";addConcept('WORKING WITH ELI');S.step=6;showCards(['I AM NOT [WORKING WITH ELI].','YES','NO','MAYBE'])}
    else line.textContent='Nara keeps the key.';
    return;
  }
  if(S.step===6){
    if(i===0){line.textContent="That's exactly what someone working with Eli would say. If you weren't helping him, you'd help me find my package.";addConcept('HELP NARA');S.step=7;showCards(['IF [HELP NARA], THEN [I WANT KEY].','YES','NO','I DUNNO'])}
    else line.textContent='Statements are not evidence.';
    return;
  }
  if(S.step===7&&i===0){line.textContent="Fine. Take it. But don't tell Eli I sent you.";addConcept('BASEMENT KEY');addConcept('NARA SENT ME');S.step=8;showCards(['YES','NO','MAYBE','I DUNNO']);return}
  if(S.step===8){line.textContent='DEMO STUB COMPLETE — next stop: Eli in the basement.'}
}
addEventListener('keydown',e=>{keys[e.key]=1;if((e.key==='e'||e.key==='E')&&!S.dialog&&near(S,nara))openTalk();if(e.key==='Escape'&&S.dialog)closeTalk();if(S.dialog&&'1234'.includes(e.key))choose(+e.key-1);});
addEventListener('keyup',e=>keys[e.key]=0);
let last=performance.now();function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);drawWorld();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body>
</html>
